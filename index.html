<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>通用报送管理系统 - 华润金融</title>
<style>
:root {
  --c-primary: #0a5c46;
  --c-accent: #f5a623;
  --c-text: #2c3441;
  --c-text-sub: #6b7686;
  --c-bg: #f4f6f9;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
  background:var(--c-bg);
  color:var(--c-text);
  min-height:100vh;
  display:flex;
  flex-direction:column;
}
/* 顶部导航 */
.header {
  background:#fff;
  border-bottom:1px solid #e6eaf0;
  box-shadow:0 2px 8px rgba(20,40,60,.05);
  padding:0 32px;
  display:flex;
  align-items:center;
  height:64px;
  flex-shrink:0;
}
.logo-block { display:flex; align-items:center; gap:12px; }
.logo-mark {
  width:40px; height:40px; border-radius:8px;
  background:linear-gradient(135deg, var(--c-primary), #0e7a5d);
  color:#fff; display:flex; align-items:center; justify-content:center;
  font-size:18px; font-weight:bold;
}
.logo-title { font-size:18px; font-weight:600; letter-spacing:1px; }
.logo-sub { font-size:12px; color:var(--c-text-sub); margin-top:2px; }
.header-right { margin-left:auto; font-size:12px; color:var(--c-text-sub); }

/* 主体 */
.main {
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:48px 24px;
}
.welcome { text-align:center; margin-bottom:40px; }
.welcome h1 { font-size:26px; font-weight:600; margin-bottom:10px; }
.welcome p { font-size:14px; color:var(--c-text-sub); }

.cards {
  display:flex;
  gap:24px;
  flex-wrap:wrap;
  justify-content:center;
  max-width:1080px;
  width:100%;
}
.card {
  flex:1 1 260px;
  max-width:320px;
  background:#fff;
  border:1px solid #e6eaf0;
  border-radius:12px;
  padding:28px 24px;
  text-decoration:none;
  color:inherit;
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  display:flex;
  flex-direction:column;
  gap:14px;
  position:relative;
  overflow:hidden;
}
.card:hover {
  transform:translateY(-4px);
  box-shadow:0 10px 28px rgba(20,40,60,.12);
  border-color:var(--c-accent);
}
.card::before {
  content:"";
  position:absolute; left:0; top:0; bottom:0; width:4px;
  background:var(--c-accent);
  opacity:0;
  transition:opacity .18s ease;
}
.card:hover::before { opacity:1; }
.card-icon {
  width:52px; height:52px; border-radius:12px;
  display:flex; align-items:center; justify-content:center;
  font-size:26px;
  background:#fff8e6;
}
.card-name { font-size:18px; font-weight:600; }
.card-desc { font-size:13px; color:var(--c-text-sub); line-height:1.7; flex:1; }
.card-enter {
  font-size:13px; color:var(--c-accent); font-weight:600;
  display:flex; align-items:center; gap:4px;
}
.card-enter::after { content:"→"; transition:transform .18s ease; }
.card:hover .card-enter::after { transform:translateX(4px); }

.footer {
  text-align:center;
  padding:18px;
  font-size:12px;
  color:#9aa4b2;
  flex-shrink:0;
}
</style>
</head>
<body>

<div class="header">
  <div class="logo-block">
    <div class="logo-mark">润</div>
    <div>
      <div class="logo-title">通用报送管理系统</div>
      <div class="logo-sub">华润金融 · 数据应用</div>
    </div>
  </div>
  <div class="header-right">指标管理平台</div>
</div>

<div class="main">
  <div class="welcome">
    <h1>欢迎使用通用报送管理系统</h1>
    <p>请从下方选择要进入的功能模块</p>
  </div>

  <div class="cards">
    <a class="card" href="指标查询.html">
      <div class="card-icon">🔍</div>
      <div class="card-name">指标查询</div>
      <div class="card-desc">浏览指标清单，按主题、分类、编码等条件检索指标，查看指标定义、口径、计算公式等详细信息。</div>
      <div class="card-enter">进入模块</div>
    </a>

    <a class="card" href="预算填报.html">
      <div class="card-icon">📝</div>
      <div class="card-name">预算填报</div>
      <div class="card-desc">按年度、月度填报经营指标全年预算数据，支持预算值录入、暂存与提交。</div>
      <div class="card-enter">进入模块</div>
    </a>

    <a class="card" href="指标管理.html">
      <div class="card-icon">⚙️</div>
      <div class="card-name">指标管理</div>
      <div class="card-desc">维护指标标准与指标目录，新增、编辑指标属性，管理指标版本与上下线状态。</div>
      <div class="card-enter">进入模块</div>
    </a>
  </div>
</div>

<div class="footer">通用报送管理系统 © 华润金融</div>

</body>
</html>
