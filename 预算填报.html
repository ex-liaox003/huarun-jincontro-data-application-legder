<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>预算填报 - 通用报送管理系统</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root{
  --c-primary:#f5a623;
  --c-primary-light:#f7b84e;
  --c-accent:#c8962e;
  --c-bg:#f5f6f8;
  --c-card:#ffffff;
  --c-text:#1f2937;
  --c-text-light:#6b7280;
  --c-border:#e5e7eb;
  --c-success:#10b981;
  --c-warning:#f59e0b;
  --c-danger:#ef4444;
  --c-info:#3b82f6;
}
body{
  font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
  background:var(--c-bg); color:var(--c-text); font-size:14px; line-height:1.6;
}

/* ===== Header（与指标查询页一致） ===== */
.header {
  position: sticky; top: 0; z-index: 100; background:#fff; height:72px;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 40px 0 24px; box-shadow:0 2px 6px rgba(0,0,0,0.04); overflow:hidden;
}
.header-left { display:flex; align-items:center; gap:18px; flex-shrink:0; }
.logo-block { display:flex; align-items:center; gap:10px; }
.logo-img { height:56px; width:auto; display:block; object-fit:contain; }
.divider { width:1px; height:32px; background:linear-gradient(180deg,transparent,#d5d9de 30%,#d5d9de 70%,transparent); }
.system-title { font-size:20px; font-weight:bold; color:#2c3e50; letter-spacing:2px; }
.header-nav { display:flex; align-items:center; gap:4px; flex:1; justify-content:center; margin:0 20px; }
.nav-item {
  padding:8px 18px; font-size:15px; color:#4a5568; cursor:pointer;
  border-radius:6px; text-decoration:none; white-space:nowrap; transition:all .15s;
}
.nav-item:hover { color:#f5a623; }
.nav-item.active { color:#f5a623; font-weight:600; background:#fff8e6; }
.header-right { display:flex; align-items:center; gap:8px; }
.user-icon { width:34px; height:34px; border-radius:50%; background:#eef1f5; display:flex; align-items:center; justify-content:center; }
.user-icon svg { width:20px; height:20px; }
.user-name { font-size:13px; color:#4a5568; }

/* ===== 页面主体 ===== */
.page{ width:100%; margin:22px auto 40px; padding:0 24px; }
.page-title-row{ display:flex; align-items:baseline; gap:12px; margin-bottom:14px; }
.page-title{ font-size:20px; font-weight:700; color:#1f2937; }
.page-title::before{ content:""; display:inline-block; width:4px; height:18px; background:var(--c-primary); border-radius:2px; margin-right:10px; vertical-align:-2px; }
.page-sub{ font-size:12.5px; color:var(--c-text-light); }

/* 工具条：新增 ｜ 下载模板 */
.toolbar{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
.toolbar .spacer{ flex:1; }

/* 按钮 */
.btn{
  display:inline-flex; align-items:center; gap:6px; height:36px; padding:0 18px;
  font-size:13.5px; border-radius:6px; border:1px solid transparent; cursor:pointer;
  font-family:inherit; transition:all .15s; text-decoration:none; background:#fff;
}
.btn:disabled{ opacity:.5; cursor:not-allowed; }
.btn-primary{ background:var(--c-primary); color:#fff; }
.btn-primary:hover:not(:disabled){ background:#e6971a; }
.btn-ghost{ color:var(--c-accent); border-color:#ecc98a; }
.btn-ghost:hover:not(:disabled){ background:#fff8e6; }
.btn svg{ width:15px; height:15px; }

/* 列表卡片 */
.card{ background:#fff; border:1px solid var(--c-border); border-radius:10px; padding:18px 20px; }
.table-wrap{ overflow:auto; border:1px solid var(--c-border); border-radius:8px; }
table.grid{ width:100%; border-collapse:collapse; font-size:13px; min-width:900px; }
table.grid thead th{
  position:sticky; top:0; background:#f5f8fc; color:#4a5568; font-weight:600;
  text-align:left; padding:10px 14px; border-bottom:1px solid var(--c-border); white-space:nowrap; z-index:1;
}
table.grid td{ padding:10px 14px; border-bottom:1px solid #f0f2f5; vertical-align:middle; white-space:nowrap; }
table.grid tbody tr:nth-child(even){ background:#f8f9fb; }
table.grid tbody tr:hover{ background:#fff8e6; }
table.grid td .unit-tag{
  display:inline-block; padding:2px 10px; border-radius:4px; background:#eef4fb; color:#2c5d9e; font-size:12.5px;
}
table.grid td .year-tag{ font-weight:600; color:#1f2937; }
td .dim{ color:#c0c4cc; }

/* 行操作链接 */
.op-link{ color:var(--c-info); cursor:pointer; font-size:13px; text-decoration:none; margin-right:14px; }
.op-link:hover{ text-decoration:underline; }
.op-link.danger{ color:var(--c-danger); margin-right:0; }
.empty-row td{ text-align:center; color:#9aa4b2; padding:36px 0 !important; font-size:13px; }

/* ===== 弹框 ===== */
.overlay{
  position:fixed; inset:0; background:rgba(15,23,42,0.45); z-index:200;
  display:none; align-items:flex-start; justify-content:center; padding:7vh 20px 20px;
}
.overlay.show{ display:flex; }
.modal{
  background:#fff; border-radius:12px; width:460px; max-width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,0.25); animation:pop .18s ease-out;
  display:flex; flex-direction:column; max-height:84vh;
}
.modal.lg{ width:760px; }
@keyframes pop{ from{ transform:translateY(-12px); opacity:0; } to{ transform:none; opacity:1; } }
.modal-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 22px; border-bottom:1px solid var(--c-border);
}
.modal-title{ font-size:15.5px; font-weight:700; color:#1f2937; }
.modal-close{
  width:28px; height:28px; border:none; background:none; cursor:pointer; font-size:16px;
  color:#9aa4b2; border-radius:6px; line-height:1;
}
.modal-close:hover{ background:#f3f4f6; color:#4a5568; }
.modal-body{ padding:20px 22px; overflow-y:auto; }
.modal-foot{
  display:flex; justify-content:flex-end; gap:10px; padding:14px 22px;
  border-top:1px solid var(--c-border);
}

/* 弹框表单 */
.m-form .f-item{ display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
.m-form .f-item:last-child{ margin-bottom:0; }
.f-label{ font-size:13px; color:#4a5568; }
.f-label b{ color:var(--c-danger); margin-right:2px; }
.f-ctrl{
  width:100%; height:36px; padding:0 12px; font-size:13.5px; color:var(--c-text);
  border:1px solid #d5dae2; border-radius:6px; background:#fff; outline:none; font-family:inherit;
}
.f-ctrl:focus{ border-color:var(--c-primary); box-shadow:0 0 0 2px rgba(245,166,35,0.15); }
.f-tip{ font-size:12px; color:#9aa4b2; }

/* 上传区 */
.dropzone{
  border:2px dashed #cfd6df; border-radius:10px; padding:30px 20px; text-align:center;
  color:var(--c-text-light); cursor:pointer; transition:all .15s; background:#fafbfc;
}
.dropzone:hover, .dropzone.drag{ border-color:var(--c-primary); background:#fffaf0; }
.dz-icon{ width:42px; height:42px; margin:0 auto 8px; }
.dz-main{ font-size:13.5px; color:#4a5568; }
.dz-main b{ color:var(--c-accent); }
.dz-sub{ font-size:12px; color:#9aa4b2; margin-top:4px; }
.dz-file{ margin-top:10px; font-size:13px; color:#1f2937; display:none; }
.dz-file .fname{ font-weight:600; color:var(--c-accent); }
.demo-link{ display:inline-block; margin-top:12px; font-size:12.5px; color:var(--c-info); cursor:pointer; }
.demo-link:hover{ text-decoration:underline; }

/* 上传弹框内校验结果 */
.up-result{ display:none; margin-top:16px; }
.up-result.show{ display:block; }
.up-banner{ display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:8px; margin-bottom:12px; font-size:13.5px; }
.up-banner.ok{ background:#ecfdf5; border:1px solid #a7e8cd; color:#047857; }
.up-banner.err{ background:#fef2f2; border:1px solid #fecaca; color:#b91c1c; }
.up-banner b{ font-size:14px; }
.up-sum{ display:flex; gap:14px; margin-bottom:10px; font-size:12.5px; color:#6b7280; }
.up-sum i{ font-style:normal; font-weight:700; font-size:15px; margin-right:3px; }
.up-sum .ok i{ color:var(--c-success); } .up-sum .bad i{ color:var(--c-danger); }
.err-table-wrap{ max-height:260px; overflow:auto; border:1px solid var(--c-border); border-radius:8px; }
.err-table-wrap table.grid{ min-width:0; font-size:12.5px; }
.err-table-wrap td{ white-space:normal; }
td.code{ font-family:Consolas,"Courier New",monospace; color:#b0791a; }
.err-reason{ color:var(--c-danger); }
.row-status{ display:inline-block; padding:1px 8px; border-radius:10px; font-size:11.5px; white-space:nowrap; }
.row-status.ok{ background:#ecfdf5; color:#047857; }
.row-status.err{ background:#fef2f2; color:#b91c1c; }

/* 新增弹框内联上传区 */
.dz-sm{ padding:18px 14px; }
.up-tt{ color:var(--c-primary); font-size:14.5px; cursor:pointer; }
.up-tt:hover{ text-decoration:underline; }
.iu-tip{ font-size:12px; color:#9aa4b2; }

/* 删除二次确认弹框 */
.cfm-modal{ width:400px; }
.cfm-body{ display:flex; align-items:flex-start; gap:12px; padding:26px 26px 10px; }
.cfm-icon{
  width:22px; height:22px; border-radius:50%; flex-shrink:0; margin-top:1px;
  background:var(--c-warning); color:#fff; font-weight:700; font-size:14px;
  display:flex; align-items:center; justify-content:center;
}
.cfm-text{ font-size:14.5px; color:#1f2937; }
.cfm-foot{ border-top:none; }
/* 失败提示内的「下载错误原因文件」链接 */
.banner-dl{ color:inherit; font-weight:700; text-decoration:underline; cursor:pointer; }

/* 文件名称列 */
.file-cell{ display:flex; align-items:center; gap:6px; max-width:320px; }
.file-name{
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer;
  color:var(--c-info); font-weight:600;
}
.file-name:hover{ text-decoration:underline; }
.file-dl{ display:inline-flex; flex-shrink:0; color:var(--c-info); cursor:pointer; }
.file-dl:hover{ color:var(--c-primary); }
.file-dl svg{ width:15px; height:15px; }

/* 文件预览弹框 */
.pv-bar{ display:flex; align-items:center; gap:10px; padding:10px 22px; border-bottom:1px solid var(--c-border); background:#fafbfc; }
.pv-name{ font-size:13px; color:#4a5568; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pv-bar .btn{ height:30px; padding:0 14px; font-size:12.5px; margin-left:auto; flex-shrink:0; }
.pv-bar .btn + .btn{ margin-left:8px; }
.pv-wrap{ overflow:auto; max-height:60vh; padding:16px 22px; }
.pv-wrap table.pv-grid{ border-collapse:collapse; font-size:12.5px; min-width:100%; }
.pv-wrap table.pv-grid th, .pv-wrap table.pv-grid td{ border:1px solid #e2e6ec; padding:7px 12px; text-align:left; white-space:nowrap; }
.pv-wrap table.pv-grid th{ background:#f5f8fc; color:#4a5568; position:sticky; top:0; z-index:1; }
.pv-wrap table.pv-grid tr:nth-child(even) td{ background:#f8f9fb; }
.pv-wrap table.pv-grid td.multi{ white-space:pre-line; }

/* toast */
.toast{
  position:fixed; top:88px; left:50%; transform:translateX(-50%) translateY(-8px);
  display:flex; align-items:center; gap:9px;
  background:#fff; color:#1f2937; padding:11px 24px 11px 16px; border-radius:6px;
  font-size:13.5px; z-index:999; opacity:0; pointer-events:none; transition:all .25s;
  box-shadow:0 4px 16px rgba(30,80,30,0.10);
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
.toast .t-ic{
  width:18px; height:18px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-size:11px; font-weight:700;
}
.toast.ok{ background:#edf8e8; border:1px solid #d8efce; color:#52a846; }
.toast.ok .t-ic{ background:#67c23a; }
.toast.err{ background:#fdeeee; border:1px solid #f6d5d5; color:#d9534f; }
.toast.err .t-ic{ background:#f56c6c; }
</style>
</head>
<body>

<!-- 顶部导航（与指标查询页一致，预算填报位于指标查询之后） -->
<div class="header">
  <div class="header-left">
    <div class="logo-block">
      <img class="logo-img" src=".codepilot-uploads/1784702798492-image.png" alt="华润金融 CR CAPITAL">
    </div>
    <div class="divider"></div>
    <div class="system-title">通用报送管理系统</div>
  </div>
  <div class="header-nav">

    <a class="nav-item" href="指标查询.html">指标查询</a>

      </svg>

    <span class="user-name">金控管理岗</span>
  </div>
</div>

<div class="page">

  <!-- 工具条：新增 ｜ 下载模板 -->
  <div class="toolbar">
    <button type="button" class="btn btn-primary" id="btnAdd">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      新增
    </button>
    <button type="button" class="btn btn-ghost" id="btnDownloadTpl">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0l-4.5-4.5M12 15l4.5-4.5M4 19h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      下载模板
    </button>

  </div>

  <!-- 填报记录列表 -->
  <div class="card">
    <div class="table-wrap">
      <table class="grid" id="listTable">
        <thead>
          <tr>
            <th style="width:80px">年份</th>
            <th style="width:150px">业务单元</th>

            <th style="width:120px">更新人</th>

            <th style="width:210px">操作</th>
          </tr>
        </thead>
        <tbody id="listBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- 弹框：新增预算填报（年份 + 业务单元 + 内联上传模板） -->
<div class="overlay" id="rangeOverlay">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="rangeModalTitle">新增预算填报</div>
      <button type="button" class="modal-close" data-close="rangeOverlay">✕</button>
    </div>
    <div class="modal-body">
      <div class="m-form">
        <div class="f-item">
          <label class="f-label" for="mSelYear"><b>*</b>年份</label>
          <select class="f-ctrl" id="mSelYear"></select>
        </div>
        <div class="f-item">
          <label class="f-label" for="mSelUnit"><b>*</b>业务单元</label>
          <select class="f-ctrl" id="mSelUnit"></select>
        </div>
        <div class="f-item">
          <label class="f-label"><b>*</b>上传模板</label>

            <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none">
          </div>
        </div>
      </div>

      <!-- 校验结果（弹框内展示，导入失败时可下载错误原因文件） -->
      <div class="up-result" id="upResult">
        <div class="up-banner" id="upBanner"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn" data-close="rangeOverlay">取 消</button>
      <button type="button" class="btn btn-primary" id="btnConfirm">确 定</button>
    </div>
  </div>
</div>

<!-- 弹框：文件在线预览 -->
<div class="overlay" id="pvOverlay">
  <div class="modal lg">
    <div class="modal-head">
      <div class="modal-title">文件预览</div>
      <button type="button" class="modal-close" data-close="pvOverlay">✕</button>
    </div>
    <div class="pv-bar">
      <span class="pv-name" id="pvName"></span>
      <button type="button" class="btn btn-ghost" id="pvDl">下载文件</button>
    </div>
    <div class="pv-wrap"><table class="pv-grid"><tbody id="pvBody"></tbody></table></div>
  </div>
</div>

<!-- 弹框：删除二次确认 -->
<div class="overlay" id="delOverlay">
  <div class="modal cfm-modal">
    <div class="modal-body cfm-body">
      <span class="cfm-icon">!</span>
      <div class="cfm-text">确认删除该填报记录？</div>
    </div>
    <div class="modal-foot cfm-foot">
      <button type="button" class="btn" data-close="delOverlay">取 消</button>
      <button type="button" class="btn btn-primary" id="btnDelOk">确 定</button>
    </div>
  </div>
</div>

function pad(n){ return (n<10?'0':'')+n; }
function fmtNow(){
  var d = new Date();
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
}
var toastTimer = null;
function toast(msg, type){
  var t = $('toast');
  t.className = 'toast show ' + (type||'');
  t.innerHTML = '<span class="t-ic">' + (type==='err' ? '✕' : '✓') + '</span>';
  var s = document.createElement('span');
  s.textContent = msg;
  t.appendChild(s);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 3200);
}

function renderList(){

    body.innerHTML = '<tr class="empty-row"><td colspan="8">暂无填报记录，点击左上角「新增」创建</td></tr>';

/* ---------- 文件在线预览与下载 ---------- */
/* 演示数据编号前缀：业务单元在标准库无指标时，按前缀合成编号，保证每个文件都有数据 */
var UNIT_CODE_PREFIX = {
  '华润金融':'STR_FIN','华润银行':'STR_BNK','华润信托':'STR_TRU','华润租赁':'STR_LSZ',
  '华润保险':'STR_INS','华润资产':'STR_CRA','华润深国投':'STR_SIT'
};
function makeWorkbookAoa(year, unit, n){
  var aoa = [TPL_HEADERS.slice(), TPL_HINTS.slice()];
  var pool = unitItems(unit);
  if(!pool.length){
    /* 标准库暂无该单元指标：借用通用指标清单合成演示数据 */
    var prefix = UNIT_CODE_PREFIX[unit] || 'STR_GEN';
    pool = stdItems.slice(0, n).map(function(it, i){
      var sn = String(i+1); while(sn.length<8) sn = '0'+sn;
      return { code: prefix + '_' + sn, name: it.name, unit: it.unit };
    });
  }
  /* 预算值按 年份+业务单元 生成确定性差异，不同记录的文件数据不同 */
  var seed = (year*31 + unit.length*97) % 500;
  pool.slice(0, n).forEach(function(it, i){ aoa.push([it.code, it.name, it.unit, String(1000 + seed + i*137)]); });
  return aoa;
}
function aoaToWorkbook(aoa){ return XLSX.utils.book_append_sheet(XLSX.utils.book_new(), XLSX.utils.aoa_to_sheet(aoa), '预算填报'); }
function aoaToBlob(aoa){ return new Blob([XLSX.write(aoaToWorkbook(aoa), {bookType:'xlsx', type:'array'})], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}); }

/* 演示数据没有真实文件：首次预览/下载时按业务范围补造内容 */
function ensureRecordAoa(rec){
  /* 演示数据没有真实文件：按业务范围补造 20 行内容；用户上传过的文件优先用其解析结果 */
  if(!rec._aoa) rec._aoa = makeWorkbookAoa(rec.year, rec.unit, 20);
  return rec._aoa;
}
function saveRecordFile(rec){
  var url = URL.createObjectURL(aoaToBlob(ensureRecordAoa(rec)));
  var a = document.createElement('a');
  a.href = url; a.download = rec.fileName || ('指标全年预算填报_'+rec.unit+'_'+rec.year+'年度.xlsx');
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
}
function previewRecordFile(rec){
  /* 在线预览隐藏第2行填写提示行（必填，…），仅展示表头与数据 */
  var aoa = ensureRecordAoa(rec).filter(function(row,ri){
    if(ri===0) return true;
    return !/^必填[,，]/.test(String(row && row[0]===undefined?'':row[0]).trim());
  });
  $('pvName').textContent = (rec.year+' 年度 · '+rec.unit+' — '+rec.fileName) + '（'+(rec.updateTime||'').slice(0,10)+' 更新，共 '+(aoa.length-1)+' 条指标）';
  $('pvBody').innerHTML = aoa.map(function(row,ri){
    var tag = ri===0 ? 'th' : 'td';
    return '<tr>' + row.map(function(c){
      var s = String(c===undefined?'':c);
      var multi = s.indexOf(String.fromCharCode(10))>=0 ? ' class="multi"' : '';
      return '<'+tag+multi+'>'+esc(s)+'</'+tag+'>';
    }).join('') + '</tr>';
  }).join('');
  $('pvDl').textContent = '下载文件';
  window.__pvRec = rec;
  openOverlay('pvOverlay');
}

var pendingFile = null;   /* { name, aoa } 已选择的文件，点「确定」时统一校验 */
var curEdit = null;       /* 编辑模式的目标记录（null=新增） */
var lastResults = null;   /* 最近一次导入的行级结果（错误原因文件数据源） */

function openRangeModal(){
  var su = $('mSelUnit');
  su.innerHTML = UNITS.map(function(u){ return '<option value="'+esc(u)+'">'+esc(u)+'</option>'; }).join('');
  su.value = '华润资产';
  var sy = $('mSelYear');
  sy.innerHTML = YEARS.map(function(y){ return '<option value="'+y+'"'+(y===2026?' selected':'')+'>'+y+' 年度</option>'; }).join('');
  curEdit = null;
  $('rangeModalTitle').textContent = '新增预算填报';
  resetUploadArea();
  openOverlay('rangeOverlay');
}
$('btnAdd').addEventListener('click', openRangeModal);

/* 编辑：打开弹框并带出该记录全部内容（年份/业务单元/已上传文件均可改） */
function openEditModal(rec){
  openRangeModal();
  curEdit = rec;
  $('rangeModalTitle').textContent = '编辑预算填报';
  var sy = $('mSelYear');
  if(![].some.call(sy.options, function(o){ return o.value===String(rec.year); }))
    sy.innerHTML += '<option value="'+rec.year+'">'+rec.year+' 年度</option>';
  sy.value = String(rec.year);
  $('mSelUnit').value = rec.unit;
  /* 带出已上传文件；重新选择即替换，不选则保留原文件 */
  var fe = $('dzFile');
  fe.style.display = 'block';
  fe.innerHTML = '已上传：<span class="fname">' + esc(rec.fileName || '—') + '</span><span class="iu-tip">　重新上传将替换该文件</span>';
}

function resetUploadArea(){
  pendingFile = null;
  lastResults = null;
  $('upResult').classList.remove('show');
  var fe = $('dzFile'); fe.style.display='none'; fe.innerHTML='';
}

/* ---------- 内联上传区：点击 / 拖入即选文件，确定时再校验 ---------- */
var dz = $('dropzone'), fileInput = $('fileInput');
dz.addEventListener('click', function(){ fileInput.click(); });
dz.addEventListener('dragover', function(e){ e.preventDefault(); dz.classList.add('drag'); });
dz.addEventListener('dragleave', function(){ dz.classList.remove('drag'); });
dz.addEventListener('drop', function(e){
  e.preventDefault(); dz.classList.remove('drag');
  if(e.dataTransfer.files && e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', function(){
  if(fileInput.files.length) handleFile(fileInput.files[0]);
  fileInput.value = '';
});

function handleFile(file){
  if(!/\.(xlsx|xls)$/i.test(file.name)){ toast('仅支持 .xlsx / .xls 文件','err'); return; }
  if(file.size > 10*1024*1024){ toast('文件超过 10MB 限制','err'); return; }
  var fe = $('dzFile');
  fe.style.display='block';
  fe.innerHTML = '已选择：<span class="fname">'+esc(file.name)+'</span>（'+(file.size/1024).toFixed(1)+' KB）';
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
      var ws = wb.Sheets[wb.SheetNames[0]];
      /* raw:true 取单元格原始值：数字不会被格式化成带千分位/单位的文本，避免误判 */
      var aoa = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:true});
      pendingFile = { name:file.name, aoa:aoa };
      /* 重新选文件后清掉上次校验结果 */
      $('upResult').classList.remove('show');
    }catch(ex){
      pendingFile = null;
      toast('文件解析失败：'+ex.message,'err');
    }
  };
  reader.readAsArrayBuffer(file);
}

/* ---------- 确定：范围 → 重复 → 表头 → 指标编号存在性，逐级校验 ---------- */
function showBanner(cls, html){
  var banner = $('upBanner');
  banner.className = 'up-banner ' + cls;
  banner.innerHTML = html;
  $('upResult').classList.add('show');
}

$('btnConfirm').addEventListener('click', function(){
  /* ① 必填范围 */
  var year = parseInt($('mSelYear').value,10);
  var unit = $('mSelUnit').value;
  if(!year || !unit){ toast('请选择年份和业务单元','err'); return; }
  if(!pendingFile && !curEdit){ toast('请先上传模板文件','err'); return; }

  /* ② 当前业务单元 + 年份是否已存在填报记录 */
  var dup = records.find(function(x){ return x.year===year && x.unit===unit && x!==curEdit; });
  if(dup){
    showBanner('err', '<span style="font-size:18px">✕</span><span><b>导入失败</b>　'+year+' 年度「'+esc(unit)+'」已存在预算填报记录（上传于 '+esc(dup.uploadTime)+'），请勿重复导入</span>');
    lastResults=null;
    return;
  }

  /* 编辑且不更换文件 → 仅更新年份/业务单元等基础字段 */
  if(curEdit && !pendingFile){
    var now0 = fmtNow();
    curEdit.year = year; curEdit.unit = unit;
    curEdit.updater = CUR_USER; curEdit.updateTime = now0;
    renderList();
    showBanner('ok', '<span style="font-size:18px">✓</span><span><b>保存成功</b>　填报记录已更新（'+year+' 年度「'+esc(unit)+'」）</span>');
    toast('保存成功','ok');
    setTimeout(function(){ closeOverlay('rangeOverlay'); }, 1200);
    return;
  }

  /* ③ 表头校验：前 4 列须与统一模板一致（允许存在「错误原因」回执列） */
  var aoa = pendingFile.aoa;
  var headIdx = -1;
  for(var i=0;i<Math.min(aoa.length,10);i++){
    var c0 = String(aoa[i][0]||'').replace(/\*/g,'').trim();
    if(c0.indexOf('指标标准编号')>=0 || c0.indexOf('指标编号')>=0){ headIdx=i; break; }
  }
  if(headIdx<0){
    showBanner('err', '<span style="font-size:18px">✕</span><span><b>导入失败</b>　表头不符合模板要求：未找到「*指标标准编号」列，请下载统一模板填写后上传</span>');
    lastResults=null;
    return;
  }
  var headerRow = aoa[headIdx].map(function(h){ return String(h).replace(/\*/g,'').trim(); });
  var need = TPL_HEADERS.map(function(h){ return h.replace(/\*/g,''); });
  var headBad = need.some(function(n,ci){ return headerRow[ci]!==n; });
  if(headBad){
    showBanner('err', '<span style="font-size:18px">✕</span><span><b>导入失败</b>　表头不符合模板要求：应依次为「'+TPL_HEADERS.join('」「')+'」</span>');
    lastResults=null;
    return;
  }

  /* ④ 逐行校验（跳过空行与提示行）：必填项 → 预算值数值格式 → 编号/名称在业务单元下的存在性；
        所有错误一次性收集，多个原因在错误原因列换行显示 */
  var results = [];
  for(var j=headIdx+1;j<aoa.length;j++){
    var row = aoa[j]||[];
    var code = String(row[0]===undefined?'':row[0]).trim();
    var name = String(row[1]===undefined?'':row[1]).trim();
    var unitC= String(row[2]===undefined?'':row[2]).trim();
    var val  = String(row[3]===undefined?'':row[3]).trim();
    if(!code && !name && !unitC && !val) continue;   /* 空行 */
    if(/^必填[,，]/.test(code)) continue;           /* 提示行 */
    var errors = [];
    /* 1) 必填项 */
    if(!code)  errors.push('指标标准编号未填写');
    if(!name)  errors.push('指标名称未填写');
    if(!unitC) errors.push('指标单位未填写');
    if(!val)   errors.push('全年预算值未填写');
    /* 2) 全年预算值格式：仅允许数值（支持负数、小数、千分位逗号；全角逗号先归一化） */
    if(val){
      var valNum = val.replace(/，/g, ',').replace(/,/g, '');
      if(valNum === '-' || isNaN(Number(valNum)) || valNum === ''){
        errors.push('全年预算值填写错误：只能填写数值，当前填写为「'+val+'」');
      }
    }
    /* 3) 当前业务单元下：编号、名称是否存在 */
    if(code){
      var std = stdByCode[code];
      if(!std) errors.push('指标编号在系统中不存在');
      else if(std.bizUnit && std.bizUnit!==unit) errors.push('指标编号不属于业务单元「'+unit+'」');
    }
    if(name && !stdItems.some(function(it){ return it.bizUnit===unit && it.name===name; })){
      errors.push('指标名称在业务单元「'+unit+'」下不存在');
    }
    results.push({rowNo:j+1, code:code, name:name, unit:unitC, val:val, errors:errors});
  }
  if(!results.length){
    showBanner('err', '<span style="font-size:18px">✕</span><span><b>导入失败</b>　未解析到有效数据行，请填写「全年预算值」后再上传</span>');
    lastResults=null;
    return;
  }
  lastResults = results;

  var errRows = results.filter(function(x){ return x.errors.length; });
  if(errRows.length){
    /* 任一行编号不存在 → 整体导入失败；「下载错误原因文件」直接挂在失败提示内 */
    showBanner('err', '<span style="font-size:18px">✕</span><span><b>导入失败</b>　请点「<a class="banner-dl">下载错误原因文件</a>」，修正后重新上传</span>');
    return;
  }

  /* ⑤ 全部通过 → 新增或更新填报记录并入库 */
  var now = fmtNow();
  if(curEdit){
    curEdit.year = year; curEdit.unit = unit;
    if(pendingFile){
      curEdit.fileName = pendingFile.name;
      curEdit._aoa = aoa;
      curEdit.uploader = CUR_USER; curEdit.uploadTime = now;
    }
    curEdit.updater = CUR_USER;
    curEdit.updateTime = now;
  }else{
    records.push({ id:++seq, year:year, unit:unit, uploader:CUR_USER, uploadTime:now, updater:CUR_USER, updateTime:now, fileName:pendingFile.name, _aoa:aoa });
  }
  renderList();
  showBanner('ok', '<span style="font-size:18px">✓</span><span><b>导入成功</b>　'+year+' 年度「'+esc(unit)+'」共 '+results.length+' 条预算数据已入库</span>');
  toast('导入成功，'+results.length+' 条预算数据已入库','ok');
  setTimeout(function(){ closeOverlay('rangeOverlay'); }, 1400);
});

/* ---------- 下载错误原因文件：原模板 + 最后一列「错误原因」 ---------- */
function downloadErrFile(){
  if(!lastResults) return;
  var aoa = [TPL_HEADERS.concat([ERR_COL]), TPL_HINTS.concat([''])];
  lastResults.forEach(function(x){
    aoa.push([x.code, x.name, x.unit, x.val, x.errors.join('\n')]);
  });
  var ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{wch:22},{wch:30},{wch:12},{wch:14},{wch:46}];
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '预算填报');
  XLSX.writeFile(wb, '指标全年预算填报模板-错误原因.xlsx');
  /* 说明：错误原因列内换行符在 Excel 中按行展示（如未自动换行，选中该列设置「自动换行」即可） */
  toast('错误原因文件已下载，修正后可直接重新上传','ok');
}

/* 预览弹框「下载文件」 */
$('pvDl').addEventListener('click', function(){
  if(window.__pvRec) saveRecordFile(window.__pvRec);
});

/* 失败提示内的「下载错误原因文件」链接：事件委托，banner 重渲染后仍生效 */
$('upBanner').addEventListener('click', function(e){
  if(e.target.closest('.banner-dl')) downloadErrFile();
});
</script>
